<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CutLocal - diagnostic</title>
<style>
  body { background:#111318; color:#e8eaf0; font:13px/1.5 ui-monospace,Consolas,monospace; padding:20px; }
  h1 { font-size:16px; color:#4cc2ff; }
  .ok { color:#5ddb8f } .no { color:#ff6b6b } .warn { color:#ffc14d }
  pre { white-space:pre-wrap }
  button { background:#2b6cff;color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit }
</style>
</head>
<body>
<h1>CutLocal — diagnostic moteur</h1>
<button id="run">Lancer les tests</button>
<button id="mux">Test encodage + muxage 4K (60 images)</button>
<label style="display:inline-block;background:#2b6cff;color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer">
  Analyser MA video (pourquoi l'export est lent)
  <input id="pick" type="file" accept="video/*" style="display:none">
</label>
<pre id="out"></pre>
<script type="module">
const out = document.getElementById('out');
const TK = new URLSearchParams(location.search).get('tk') || '';
function log(s, cls) { out.insertAdjacentHTML('beforeend', `<span class="${cls||''}">${s}</span>\n`); }

const VIDEO_CANDIDATES = [
  ['H.264 High 4K',    { codec: 'avc1.640033', width: 3840, height: 2160, framerate: 60, bitrate: 60e6, avc: { format: 'avc' } }],
  ['H.264 High 1080p', { codec: 'avc1.640028', width: 1920, height: 1080, framerate: 60, bitrate: 20e6, avc: { format: 'avc' } }],
  ['H.264 Main 4K',    { codec: 'avc1.4d0033', width: 3840, height: 2160, framerate: 60, bitrate: 60e6, avc: { format: 'avc' } }],
  ['HEVC 4K',          { codec: 'hvc1.1.6.L153.B0', width: 3840, height: 2160, framerate: 60, bitrate: 45e6, hevc: { format: 'hevc' } }],
  ['AV1 4K',           { codec: 'av01.0.09M.08', width: 3840, height: 2160, framerate: 60, bitrate: 35e6 }],
  ['VP9 4K',           { codec: 'vp09.00.51.08', width: 3840, height: 2160, framerate: 60, bitrate: 40e6 }],
];

async function tests() {
  out.textContent = '';
  log('userAgent: ' + navigator.userAgent);
  log('coeurs CPU: ' + navigator.hardwareConcurrency);
  log('memoire (approx): ' + (navigator.deviceMemory || '?') + ' Go');
  log('');

  log('--- WebGL2 ---');
  const c = document.createElement('canvas');
  const gl = c.getContext('webgl2', { premultipliedAlpha: false });
  if (!gl) log('WebGL2 INDISPONIBLE', 'no');
  else {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    log('GPU: ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '?'), 'ok');
    log('texture max: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE));
    log('EXT_color_buffer_float: ' + !!gl.getExtension('EXT_color_buffer_float'));
  }
  log('');

  log('--- WebCodecs ---');
  log('VideoEncoder: ' + (typeof VideoEncoder !== 'undefined' ? 'oui' : 'NON'), typeof VideoEncoder !== 'undefined' ? 'ok' : 'no');
  log('VideoDecoder: ' + (typeof VideoDecoder !== 'undefined' ? 'oui' : 'NON'), typeof VideoDecoder !== 'undefined' ? 'ok' : 'no');
  log('AudioEncoder: ' + (typeof AudioEncoder !== 'undefined' ? 'oui' : 'NON'), typeof AudioEncoder !== 'undefined' ? 'ok' : 'no');
  log('AudioDecoder: ' + (typeof AudioDecoder !== 'undefined' ? 'oui' : 'NON'), typeof AudioDecoder !== 'undefined' ? 'ok' : 'no');
  log('');

  if (typeof VideoEncoder !== 'undefined') {
    log('--- encodeurs video ---');
    for (const [name, cfg] of VIDEO_CANDIDATES) {
      for (const accel of ['prefer-hardware', 'prefer-software', 'no-preference']) {
        try {
          const r = await VideoEncoder.isConfigSupported({ ...cfg, hardwareAcceleration: accel });
          log(`${name.padEnd(18)} ${accel.padEnd(18)} ${r.supported ? 'OK' : 'non'}`, r.supported ? 'ok' : '');
        } catch (e) {
          log(`${name.padEnd(18)} ${accel.padEnd(18)} erreur: ${e.message}`, 'warn');
        }
      }
    }
    log('');
  }

  if (typeof VideoDecoder !== 'undefined') {
    log('--- decodeurs video ---');
    for (const codec of ['avc1.640028', 'avc1.42E01E', 'hvc1.1.6.L120.B0', 'hev1.1.6.L120.B0', 'av01.0.08M.08', 'vp09.00.10.08', 'vp8']) {
      try {
        const r = await VideoDecoder.isConfigSupported({ codec, hardwareAcceleration: 'no-preference' });
        log(`${codec.padEnd(20)} ${r.supported ? 'OK' : 'non'}`, r.supported ? 'ok' : '');
      } catch (e) { log(`${codec.padEnd(20)} erreur ${e.message}`, 'warn'); }
    }
    log('');
  }

  if (typeof AudioEncoder !== 'undefined') {
    log('--- encodeurs audio ---');
    for (const codec of ['mp4a.40.2', 'mp4a.40.5', 'opus']) {
      try {
        const r = await AudioEncoder.isConfigSupported({ codec, sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 });
        log(`${codec.padEnd(14)} ${r.supported ? 'OK' : 'non'}`, r.supported ? 'ok' : '');
      } catch (e) { log(`${codec.padEnd(14)} erreur ${e.message}`, 'warn'); }
    }
    log('');
  }

  log('--- divers ---');
  log('OffscreenCanvas: ' + (typeof OffscreenCanvas !== 'undefined'));
  log('VideoFrame: ' + (typeof VideoFrame !== 'undefined'));
  log('requestVideoFrameCallback: ' + ('requestVideoFrameCallback' in HTMLVideoElement.prototype));
  log('AudioContext: ' + (typeof AudioContext !== 'undefined'));
  log('showSaveFilePicker: ' + (typeof window.showSaveFilePicker !== 'undefined'));
}

// ---- test complet : encodage 4K -> POST -> muxage serveur -> lecture
async function muxTest() {
  out.textContent = '';
  const W = 3840, H = 2160, FPS = 60, N = 60;
  const cv = new OffscreenCanvas(W, H);
  const ctx = cv.getContext('2d');

  let cfg = null;
  for (const codec of ['avc1.640033', 'avc1.4d0033', 'avc1.640028']) {
    const test = { codec, width: W, height: H, framerate: FPS, bitrate: 60e6, avc: { format: 'avc' }, hardwareAcceleration: 'prefer-hardware' };
    const r = await VideoEncoder.isConfigSupported(test).catch(() => ({ supported: false }));
    if (r.supported) { cfg = r.config || test; break; }
    const r2 = await VideoEncoder.isConfigSupported({ ...test, hardwareAcceleration: 'no-preference' }).catch(() => ({ supported: false }));
    if (r2.supported) { cfg = r2.config || { ...test, hardwareAcceleration: 'no-preference' }; break; }
  }
  if (!cfg) return log('aucune config H.264 4K supportee', 'no');
  log('config: ' + JSON.stringify(cfg));

  const chunks = [];
  let description = null;
  const enc = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description && !description) {
        description = new Uint8Array(meta.decoderConfig.description);
      }
      const b = new Uint8Array(chunk.byteLength);
      chunk.copyTo(b);
      chunks.push({ data: b, key: chunk.type === 'key' });
    },
    error: (e) => log('erreur encodeur: ' + e.message, 'no'),
  });
  enc.configure(cfg);

  const t0 = performance.now();
  for (let i = 0; i < N; i++) {
    ctx.fillStyle = `hsl(${(i * 6) % 360} 70% 45%)`;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = '400px sans-serif';
    ctx.fillText('' + i, 200 + (i * 40) % 2000, 1200);
    const frame = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(frame, { keyFrame: i % 60 === 0 });
    frame.close();
    if (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 1));
  }
  await enc.flush();
  enc.close();
  const dt = (performance.now() - t0) / 1000;
  const bytes = chunks.reduce((s, c) => s + c.data.length, 0);
  log(`${N} images 4K encodees en ${dt.toFixed(2)} s -> ${(N / dt).toFixed(1)} img/s`, 'ok');
  log(`taille: ${(bytes / 1048576).toFixed(2)} Mo, description avcC: ${description ? description.length + ' o' : 'ABSENTE'}`,
      description ? 'ok' : 'no');

  // muxage serveur
  const b64 = description ? btoa(String.fromCharCode(...description)) : '';
  // Le dossier temporaire vient du serveur : ecrit en dur, il ne vaudrait que
  // sur une seule machine.
  const ping = await fetch(`/api/ping?tk=${TK}`).then((r) => r.json());
  const outPath = ping.tmp + ping.sep + 'cutlocal-selftest.mp4';
  const beg = await fetch(`/api/export/begin?tk=${TK}`, {
    method: 'POST',
    body: JSON.stringify({
      path: outPath,
      video: { codec: 'avc', width: W, height: H, timescale: FPS * 1000, description: b64 },
    }),
  }).then((r) => r.json());
  if (!beg.session) return log('begin echoue: ' + JSON.stringify(beg), 'no');

  const parts = [];
  for (const c of chunks) {
    const head = new ArrayBuffer(16);
    const dv = new DataView(head);
    dv.setUint32(0, 0xc0def00d, true);
    dv.setUint8(4, 0);
    dv.setUint8(5, c.key ? 1 : 0);
    dv.setUint32(8, 1000, true);
    dv.setUint32(12, c.data.length, true);
    parts.push(head, c.data);
  }
  const body = new Blob(parts);
  const app = await fetch(`/api/export/append?tk=${TK}&s=${beg.session}`, { method: 'POST', body }).then((r) => r.json());
  log('append: ' + JSON.stringify(app));
  const fin = await fetch(`/api/export/end?tk=${TK}&s=${beg.session}`, { method: 'POST' }).then((r) => r.json());
  log('fin: ' + JSON.stringify(fin), 'ok');

  // verification : le navigateur relit-il notre MP4 ?
  const v = document.createElement('video');
  v.src = `/media?tk=${TK}&p=${encodeURIComponent(outPath)}`;
  v.muted = true;
  await new Promise((res, rej) => {
    v.onloadedmetadata = res;
    v.onerror = () => rej(new Error('lecture impossible'));
    setTimeout(() => rej(new Error('timeout')), 10000);
  }).then(() => {
    log(`RELECTURE OK -> ${v.videoWidth}x${v.videoHeight}, duree ${v.duration.toFixed(3)} s (attendu ${(N/FPS).toFixed(3)})`, 'ok');
  }).catch((e) => log('RELECTURE ECHEC: ' + e.message, 'no'));
  v.currentTime = 0.5;
  document.body.appendChild(v);
  v.style.width = '480px';
  v.controls = true;
}

document.getElementById('run').onclick = () => tests().catch((e) => log('exception: ' + e.stack, 'no'));
document.getElementById('mux').onclick = () => muxTest().catch((e) => log('exception: ' + e.stack, 'no'));

/* ------------------------------------------------ analyse d'une vraie video */
document.getElementById('pick').addEventListener('change', async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  out.textContent = '';
  const { Mp4File, blobReader, isIsoBmff } = await import('./js/mp4demux.js');
  const { ClipDecoder } = await import('./js/decode.js');
  const { newClip } = await import('./js/state.js');

  log('Fichier : ' + file.name);
  log('Taille  : ' + (file.size / 1e6).toFixed(1) + ' Mo');

  // 1) debit brut du disque qui contient ce fichier
  const N = Math.min(12, Math.max(3, Math.floor(file.size / (4 * 1024 * 1024))));
  const t0 = performance.now();
  let read = 0;
  for (let i = 0; i < N; i++) {
    const off = Math.floor((i / N) * Math.max(0, file.size - 4e6));
    read += (await file.slice(off, off + 4e6).arrayBuffer()).byteLength;
  }
  const secs = (performance.now() - t0) / 1000;
  const mbps = (read / 1e6) / Math.max(0.001, secs);
  log('Debit du disque : ' + mbps.toFixed(0) + ' Mo/s',
      mbps < 25 ? 'no' : mbps < 80 ? 'warn' : 'ok');
  if (mbps < 25) log('  -> ce disque est lent : copiez la video sur le disque systeme.', 'no');

  // 2) conteneur lisible par WebCodecs ?
  const iso = await isIsoBmff(file);
  log('Conteneur MP4/MOV : ' + (iso ? 'oui' : 'NON (WebM, MKV, AVI...)'), iso ? 'ok' : 'no');
  if (!iso) {
    log("  -> l'editeur ne peut pas le decoder image par image : export tres lent.", "no");
    log('  -> reimportez-la en MP4 H.264 (le telechargement par lien le fait).', 'no');
    return;
  }
  const mp4 = await Mp4File.open(blobReader(file));
  const vt = mp4.videoTrack;
  if (!vt) { log('Aucune piste video trouvee.', 'no'); return; }
  log('Codec   : ' + vt.codec + '  ' + vt.width + 'x' + vt.height);
  log('Duree   : ' + mp4.duration.toFixed(2) + ' s, ' + vt.samples.length + ' images, ' + (vt.fps || 0).toFixed(2) + ' i/s');
  log('Decalage de montage (elst) : ' + (vt.tOffset || 0).toFixed(3) + ' s',
      Math.abs(vt.tOffset || 0) > 0.5 ? 'warn' : '');

  // distance entre images cles : c'est ce qui coute cher a chaque repositionnement
  let keys = 0, maxGap = 0, prev = -1;
  for (let i = 0; i < vt.samples.length; i++) {
    if (!vt.samples[i].sync) continue;
    keys++;
    if (prev >= 0) maxGap = Math.max(maxGap, i - prev);
    prev = i;
  }
  log('Images cles : ' + keys + ' (au plus ' + maxGap + ' images entre deux)',
      maxGap > 150 ? 'warn' : 'ok');

  let sup = false;
  try {
    const r = await VideoDecoder.isConfigSupported({
      codec: vt.codec, description: vt.description || undefined,
      codedWidth: vt.width, codedHeight: vt.height,
    });
    sup = !!r.supported;
  } catch (_) {}
  log('Decodable par WebCodecs : ' + (sup ? 'oui' : 'NON -> repli tres lent'), sup ? 'ok' : 'no');

  // 3) debit de decodage reel, en lecture sequentielle comme a l'export
  const media = { id: 'x', name: file.name, kind: 'video', duration: mp4.duration,
    width: vt.width, height: vt.height, fps: vt.fps, hasVideo: true, codec: vt.codec };
  const lib = { files: new Map([['x', file]]), file: () => file,
    url: () => URL.createObjectURL(file), mp4Of: async () => mp4 };
  const clip = newClip({ mediaId: 'x', t0: 0, dur: mp4.duration, in: 0 });
  const dec = new ClipDecoder(lib, media, clip);
  await dec.init();
  log('Mode de decodage : ' + dec.mode, dec.mode === 'codec' ? 'ok' : 'no');
  const hw = dec.accel === 'prefer-hardware';
  log('Decodage accelere par le GPU : ' + (hw ? 'OUI' : 'NON (logiciel — tres lent en 4K)'), hw ? 'ok' : 'no');

  const OUTFPS = 60, COUNT = 60;
  const t1 = performance.now();
  let got = 0;
  for (let i = 0; i < COUNT; i++) {
    const g = await dec.frameAt(i / OUTFPS);
    if (g) got++;
  }
  const s1 = (performance.now() - t1) / 1000;
  log('Decodage : ' + (COUNT / s1).toFixed(1) + ' images/s  (' + got + '/' + COUNT + ' images obtenues)',
      COUNT / s1 < 15 ? 'no' : COUNT / s1 < 40 ? 'warn' : 'ok');
  log('  repositionnements : ' + dec.seekCount + ' pour ' + COUNT + ' images  ('
      + (dec.seekCount / COUNT).toFixed(2) + ' par image)', dec.seekCount > COUNT * 0.5 ? 'no' : 'ok');
  log('  temps passe a lire le fichier : ' + dec.readMs.toFixed(0) + ' ms sur ' + (s1 * 1000).toFixed(0) + ' ms  ('
      + (100 * dec.readMs / Math.max(1, s1 * 1000)).toFixed(0) + ' %)');
  dec.close();

  log('');
  const dfps = COUNT / s1;
  if (dec.seekCount > COUNT * 0.5) log("VERDICT : le decodeur repart d'une image cle sans arret. C'est la cause.", "no");
  else if (!hw && dfps < 30) log('VERDICT : cette video est decodee en LOGICIEL (' + vt.codec + '). Reencodez-la en H.264 pour un export rapide.', 'no');
  else if (mbps < 25) log('VERDICT : le disque qui contient la video est le frein.', 'no');
  else if (dfps < 15) log('VERDICT : cette video est simplement lourde a decoder (resolution/codec).', 'warn');
  else log('VERDICT : la lecture de cette video est normale (' + dfps.toFixed(0) + ' i/s).', 'ok');
});
</script>
</body>
</html>
